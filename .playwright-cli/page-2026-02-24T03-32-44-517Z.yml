                    - generic [ref=e1383]: "(이전 표에서 정리한 행사 활동 내용) ###지침 우리학교 동물복지 관련 교육활동을 홍보하는 보도자료를 작성해. 교육지원청에 업로드할 거니까 예시로 제안하는 형식과 스타일을 충실하게 따라야 해. ###예시 가평교육지원청,‘미래를 여는 SW 드론 코딩 교육’운영 체험 중심 드론·코딩 수업으로 학생 창의력과 디지털 역량 강화 ◦ 생활 밀착형 드론·코딩 체험으로 미래 사회 핵심 역량 기른다. ◦ 안전·원리·코딩까지 단계별 학습, 학생 참여와 몰입도 높아 가평교육지원청(교육장 OOO)은 9월 3일 가평초등학교를 비롯한 관내 학교에서 ‘미래를 여는 SW 드론 코딩 교육’을 운영했다고 밝혔다. 이번 교육은 학생들이 단순한 조종 체험을 넘어 드론 기술과 소프트웨어를 융합적으로 이해할 수 있도록 기획되었다. 먼저 농업 방제, 재난 물자 수송, 영상 촬영 등 드론의 실생활 활용 사례를 살펴보며 생활 속에서 드론이 갖는 의미를 탐구했다. 이어 실외 비행 원칙, 배터리 장착과 분리 절차, 머리·의복 안전관리 등 기본 안전 수칙을 익히며 책임 있는 사용 습관을 배웠다. 체험 수업에서는 학생들이 직접 조종기를 조작하고 호버링을 실습하며 드론의 기본 비행 원리를 몸소 경험했다. 나아가 학년 수준에 맞춘 기초 코딩 활동을 통해 자동 이륙과 정지 등 기본 동작을 구현하며, 창의적 문제 해결과 논리적 사고력을 키울 수 있는 시간을 가졌다. 수업에 참여한 교사들은 “학생들이 생활과 연결된 사례에서 흥미를 느끼고, 직접 드론을 날리고 코딩해 보면서 참여와 몰입도가 매우 높았다”는 소감을 전했다. OOO 교육장은 “이번 드론 코딩 교육은 미래 사회를 살아갈 학생들에게 꼭 필요한 디지털 리터러시와 창의적 역량을 길러주는 과정”이라며, “앞으로도 지역 학생들이 스스로 배우고 탐구하는 미래형 SW·AI 교육을 꾸준히 확대해 나가겠다”고 말했다."
